course_description: >
  This course covers **OpenClaw**, an open-source personal AI assistant you run on your own devices.


  OpenClaw lets you interact with AI through the messaging channels you already use — WhatsApp, Telegram,
  Slack, Discord, Google Chat, Signal, iMessage, Microsoft Teams, and more. It supports voice on
  macOS/iOS/Android, a live Canvas workspace, and a local-first Gateway that acts as the control plane
  for all your sessions, channels, tools, and events.


  Students will learn how to install and configure OpenClaw, connect it to messaging channels, choose and
  manage AI models, secure inbound DMs with the built-in pairing system, and extend its capabilities
  through skills and the onboarding wizard.


  Source: [https://github.com/openclaw/openclaw](https://github.com/openclaw/openclaw)
